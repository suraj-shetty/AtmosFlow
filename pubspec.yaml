name: atmos_flow
description: "AtmosFlow — a beautifully forecasted weather app."
publish_to: 'none'
# The build number after the + is CFBundleVersion / versionCode. Without it
# Flutter uses the whole version string as the build number too, which gives
# iOS a CFBundleVersion of "0.1.0" — legal, but nothing you can increment.
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.2
  go_router: ^17.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^3.1.15
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Pulled in transitively by flutter_test; named here because
  # test/routing/lifecycle_test.dart uses forceGC directly to prove a
  # dismissed screen is actually collected, not merely unmounted.
  leak_tracker: ^11.0.2
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
          weight: 400
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
