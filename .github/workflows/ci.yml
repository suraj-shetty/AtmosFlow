name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated code (freezed + json_serializable) is committed, so there is
      # no codegen step here — if the checked-in output has drifted from the
      # models, analyze is what catches it.
      - name: Analyze
        run: flutter analyze

      # Goldens are excluded, not skipped for convenience: they are a record of
      # what the app looks like, and text rasterises differently on a runner
      # than on the machine that rendered them, so all 21 fail there while
      # being correct. They run on `flutter test` locally, where a diff is a
      # prompt to go and look. What CI gates is behaviour.
      - name: Test
        run: flutter test --exclude-tags golden
